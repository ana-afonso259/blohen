/* ===== Cores (modo claro por defeito) ===== */
:root{
  --bg:#fff7f9; --fg:#2b2330; --card:#ffffff; --muted:#7b6f82;
  --accent:#e85d8a; --accent-2:#ffd6e3; --line:#f0dce4;
  --n1:#fff3b8; --n2:#d9f5e3; --n3:#dcebff; --n4:#f3dcff;
  --sombra:0 6px 18px rgba(120,60,90,.08);
}
/* Modo escuro (escolhido no botão) */
:root[data-theme="dark"]{
  --bg:#17131c; --fg:#f1ecf5; --card:#221c2a; --muted:#a99fb3;
  --accent:#ff7aa6; --accent-2:#3a2433; --line:#34293f;
  --n1:#4a4320; --n2:#1f4130; --n3:#1f3350; --n4:#3d2850;
  --sombra:0 6px 18px rgba(0,0,0,.35);
}
/* Segue o tema do dispositivo se o utilizador ainda não escolheu */
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#17131c; --fg:#f1ecf5; --card:#221c2a; --muted:#a99fb3;
    --accent:#ff7aa6; --accent-2:#3a2433; --line:#34293f;
    --n1:#4a4320; --n2:#1f4130; --n3:#1f3350; --n4:#3d2850;
    --sombra:0 6px 18px rgba(0,0,0,.35);
  }
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;transition:background .25s,color .25s}
a{color:var(--accent)}

/* ===== Navbar ===== */
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:700;white-space:nowrap;text-decoration:none;color:var(--fg)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;white-space:nowrap;font-size:.95rem}
nav a:hover{color:var(--fg)}
nav a.on{background:var(--accent);color:#fff}
#tema{font:inherit;font-size:1.1rem;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:6px 10px}

/* ===== Layout ===== */
main{max-width:920px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:2rem;margin:.2em 0 .3em}
.sub{color:var(--muted);margin-top:-.2em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sombra)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:18px}
footer{text-align:center;color:var(--muted);padding:24px 16px;font-size:.9rem}

/* ===== Página principal ===== */
.hero{text-align:center;padding:36px 16px;background:var(--accent-2);border-radius:24px}
.hero .grande{font-size:3.4rem;display:block;animation:flutua 3s ease-in-out infinite}
.hero p{max-width:46ch;margin:.6em auto;font-size:1.1rem}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.btn{display:inline-block;font:inherit;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 16px;font-size:.95rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.atalho{text-decoration:none;color:inherit;display:block}
.atalho:hover{border-color:var(--accent)}
.atalho b{font-size:1.05rem}.atalho span{display:block;color:var(--muted);font-size:.9rem}

/* ===== Cartas (PDF) ===== */
.carta{display:flex;flex-direction:column;gap:6px}
.carta .icone{font-size:2rem}
.carta h3{margin:0}
.meta{color:var(--muted);font-size:.85rem;margin:0}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}

/* ===== Notas (textos pequenos) ===== */
.nota{border-radius:14px;padding:16px;box-shadow:var(--sombra);color:var(--fg)}
.nota p{margin:0 0 8px}
.nota small{color:var(--muted)}
.nota:nth-child(4n+1){background:var(--n1)}
.nota:nth-child(4n+2){background:var(--n2)}
.nota:nth-child(4n+3){background:var(--n3)}
.nota:nth-child(4n+4){background:var(--n4)}

/* ===== Galerias de imagens ===== */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}
.galeria figure{margin:0;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sombra)}
.galeria img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}
.galeria figcaption{padding:8px 12px;font-size:.9rem;color:var(--muted)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
